<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Threat Intelligence Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#e8eef7;font:15px/1.65 system-ui}header{position:sticky;top:0;z-index:5;background:#0a111bee;border-bottom:1px solid #1d2a3b}.bar{max-width:1250px;margin:auto;padding:18px 22px;display:flex;gap:18px;align-items:center}.brand{font-size:21px;font-weight:800}.brand span{color:#55d6be}.search{flex:1;max-width:720px;padding:13px 16px;border-radius:12px;border:1px solid #33445a;background:#111b29;color:#fff}.hero{max-width:1250px;margin:auto;padding:45px 22px 25px}.eyebrow{color:#55d6be;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;margin:10px 0}.hero p{color:#9eafc3;max-width:780px;font-size:17px}.stats{display:flex;flex-wrap:wrap;gap:10px}.pill{border:1px solid #26384e;background:#0d1420;padding:7px 12px;border-radius:999px;color:#b9c8d9}.wrap{max-width:1250px;margin:auto;padding:0 22px 50px}.content{background:#0b121d;border:1px solid #1d2a3b;border-radius:18px;padding:30px;overflow:auto}.content h1,.content h2,.content h3{color:#fff}.content a{color:#55d6be}.content table{width:100%;border-collapse:collapse}.content td,.content th{border-bottom:1px solid #1d2a3b;padding:12px;text-align:left;vertical-align:top}.status{color:#7f91a7;font-size:13px;margin:12px 0 18px}@media(max-width:700px){.bar{display:block}.search{width:100%;margin-top:14px}.hero{padding-top:30px}.content{padding:18px}}</style></head><body><header><div class="bar"><div class="brand">Threat<span>Intel</span> Portal</div><input id="q" class="search" placeholder="Search threat intelligence resources..."></div></header><section class="hero"><div class="eyebrow">Cybersecurity Knowledge Base</div><h1>Threat Intelligence Portal</h1><p>One place to explore threat intelligence sources, frameworks, platforms, tools, research and security references.</p><div class="stats"><span class="pill">Open Source</span><span class="pill">Offline Ready</span><span class="pill">Auto Sync</span><span class="pill">Windows</span></div></section><main class="wrap"><div id="status" class="status">Loading local database...</div><article id="content" class="content"></article></main><script>const db=window.threatIntel?.getDatabase?.()||"";function render(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/^[-*] (.*)$/gm,"<li>$1</li>").replace(/\n\n/g,"</p><p>");return "<p>"+s+"</p>"}document.getElementById("content").innerHTML=render(db);document.getElementById("status").textContent=db?"Database ready • Offline mode available":"Database unavailable";document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#content h1,#content h2,#content h3,#content p,#content li,#content tr").forEach(x=>x.style.display=!q||x.textContent.toLowerCase().includes(q)?"":"none")};</script></body></html>
