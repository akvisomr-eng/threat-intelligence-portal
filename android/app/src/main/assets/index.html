<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Threat Intelligence Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#e8eef7;font:15px/1.65 system-ui}header{position:sticky;top:0;background:#0a111bee;border-bottom:1px solid #1d2a3b}.bar{padding:16px 18px}.brand{font-size:21px;font-weight:800}.brand span{color:#55d6be}.search{margin-top:13px;width:100%;padding:13px 15px;border-radius:12px;border:1px solid #33445a;background:#111b29;color:#fff}.hero{padding:32px 18px 20px}.eyebrow{color:#55d6be;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}.hero h1{font-size:38px;line-height:1.05;margin:9px 0}.hero p{color:#9eafc3}.stats{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #26384e;background:#0d1420;padding:6px 10px;border-radius:999px;color:#b9c8d9}.wrap{padding:0 18px 40px}.content{background:#0b121d;border:1px solid #1d2a3b;border-radius:16px;padding:20px;overflow:auto}.content h1,.content h2,.content h3{color:#fff}.content a{color:#55d6be}.content table{width:100%;border-collapse:collapse}.content td{border-bottom:1px solid #1d2a3b;padding:10px;vertical-align:top}.status{color:#7f91a7;font-size:13px;margin:8px 0 15px}</style></head><body><header><div class="bar"><div class="brand">Threat<span>Intel</span> Portal</div><input id="q" class="search" placeholder="Search threat intelligence resources..."></div></header><section class="hero"><div class="eyebrow">Cybersecurity Knowledge Base</div><h1>Threat Intelligence Portal</h1><p>Explore threat intelligence sources, frameworks, platforms, tools, research and security references.</p><div class="stats"><span class="pill">Open Source</span><span class="pill">Offline Ready</span><span class="pill">Auto Sync</span><span class="pill">Android</span></div></section><main class="wrap"><div id="status" class="status">Loading database...</div><article id="content" class="content"></article></main><script>const db=window.threatIntel?.getDatabase?.()||"";function render(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/^[-*] (.*)$/gm,"<li>$1</li>").replace(/\n\n/g,"</p><p>");return "<p>"+s+"</p>"}document.getElementById("content").innerHTML=render(db);document.getElementById("status").textContent=db?"Database ready • Offline mode available":"Database unavailable";document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#content h1,#content h2,#content h3,#content p,#content li,#content tr").forEach(x=>x.style.display=!q||x.textContent.toLowerCase().includes(q)?"":"none")};</script></body></html>
